# Універсальна конфігурація пайплайну обробки дзвінків

drive_structure:
  # Шаблон відносного шляху папок всередині кореневої папки Google Drive.
  # Доступні плейсхолдери: {manager_name}, {call_type}
  # Приклади:
  #   "{manager_name}/{call_type}" -> Root / Іван Франко / cold_call / audio.mp3
  #   "{call_type}/{manager_name}" -> Root / cold_call / Іван Франко / audio.mp3
  #   "{manager_name}"             -> Root / Іван Франко / audio.mp3 (call_type буде "default")
  path_pattern: "{manager_name}/{call_type}"

  # Список валідних назв папок (типів дзвінків).
  # Якщо папка не входить у цей список і allow_any_call_type=false — файл ігнорується (згідно зі схемою).
  valid_call_types:
    - "cold_call"
    - "consultation"
    - "follow_up"
    - "support"
    - "closing"

  # Якщо true — дозволяти будь-які назви папок для {call_type}
  allow_any_call_type: false

  # Підтримувані розширення та MIME-типи аудіофайлів
  allowed_extensions:
    - ".mp3"
    - ".wav"
    - ".m4a"
    - ".ogg"
    - ".flac"
    - ".aac"

gemini:
  transcription_model: "gemini-2.5-flash"
  evaluation_model: "gemini-2.5-flash"
  temperature: 0.2

prompts:
  # Нода 41: Промпт для транскрибації аудіофайлу
  transcription: |
    Ти — професійний транскрибатор телефонних розмов відділу продажу та підтримки.
    Прослухай прикріплений аудіозапис і зроби точну дослівну транскрибацію розмови українською (або мовою оригіналу).

    Вимоги до форматування:
    1. Розділяй репліки за ролями: "Менеджер:" та "Клієнт:".
    2. Додавай таймкоди у форматі [MM:SS] на початку кожної репліки.
    3. Зберігай важливі емоційні маркери або паузи в дужках, якщо вони впливають на зміст.
    4. Не вигадуй текст, якого немає в аудіо. Якщо слово нерозбірливе, познач як [нерозбірливо].

  # Нода 50: Базовий промпт для оцінки якості розмови (використовується, якщо немає специфічного для call_type)
  # Доступні змінні: {manager_name}, {call_type}, {transcript}
  evaluation_default: |
    Ти — керівник відділу контролю якості (QA) кол-центру.
    Проаналізуй транскрипцію телефонної розмови та оціни роботу менеджера згідно з критеріями.

    Менеджер: {manager_name}
    Тип дзвінка: {call_type}

    Транскрипція розмови:
    ---
    {transcript}
    ---

    Оціни розмову за такими критеріями (від 1 до 10 балів кожен):
    1. Привітання та представлення (чи назвав ім'я, компанію, мету дзвінка).
    2. Виявлення потреб клієнта (активне слухання, доречні запитання).
    3. Презентація рішення / продукту (аргументація, мова вигод для клієнта).
    4. Робота з запереченнями (спокій, аргументованість, відсутність тиску).
    5. Завершення розмови та фіксація наступного кроку (домовленість про конкретні дії).
    6. Загальна культура мовлення та емпатія.

    Розрахуй загальну оцінку (overall_score від 0 до 100), виділи сильні та слабкі сторони, а також надай конкретні рекомендації для менеджера.

  # Специфічні промпти для окремих типів дзвінків (перевизначають evaluation_default)
  evaluation_by_call_type:
    cold_call: |
      Ти — експерт з оцінки холодних продажів (Cold Calling QA).
      Оціни холодний дзвінок менеджера {manager_name}.

      Транскрипція розмови:
      ---
      {transcript}
      ---

      Зверни особливу увагу на:
      1. Проходження секретаря / вихід на ЛПР.
      2. Захоплення уваги в перші 15 секунд (Hook).
      3. Кваліфікацію клієнта.
      4. Опрацювання типових відмовок ("мені не цікаво", "скиньте на пошту").
      5. Закриття на наступний цільовий крок (зустріч / демо).
      Надай структуровану оцінку.

